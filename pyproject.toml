[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-memory-warning"
version = "0.2.0"
description = "Lightweight macOS daemon and Menu Bar tray app that alerts you via native notifications when a process exceeds RAM threshold."
readme = "README.md"
authors = [{ name = "mac-memory-warning contributors" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
keywords = ["macos", "memory", "ram", "monitor", "notification", "daemon", "process", "menubar", "tray", "status-bar"]
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gui = [
    "rumps>=0.4.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
all = [
    "psutil>=5.9.0",
    "rumps>=0.4.0",
    "pytest>=7.0",
]

[project.scripts]
memory-warning = "memory_monitor:main"
memory-warning-app = "menubar:main"

[project.urls]
Homepage = "https://github.com/yourusername/mac-memory-warning"
Repository = "https://github.com/yourusername/mac-memory-warning.git"
Issues = "https://github.com/yourusername/mac-memory-warning/issues"

[tool.pytest.ini_options]
pythonpath = ["."]

