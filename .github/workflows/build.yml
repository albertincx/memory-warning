name: Build and Release Memory Warning

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v0.2.1)'
        required: false
        default: ''

jobs:
  test:
    name: Test on macOS
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,gui]

      - name: Run tests
        run: |
          pytest

  build-macos:
    name: Build & Package macOS Application
    needs: test
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Version Name
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VER="${{ github.event.inputs.version_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            PKG_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" 2>/dev/null || grep -m1 version pyproject.toml | cut -d'"' -f2)
            SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
            VER="v${PKG_VER}-${SHORT_SHA}"
          fi
          echo "APP_VERSION=${VER}" >> $GITHUB_ENV
          echo "Resolved version: ${VER}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .[gui]

      - name: Build macOS Application Bundle
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Package Application Archive
        run: |
          DIST_ZIP="Memory-Warning-${APP_VERSION}-macos.zip"
          mkdir -p build_output

          # Copy .app bundle and helper scripts
          cp -r "Memory Warning.app" build_output/
          cp run.command build_output/
          cp install_agent.sh build_output/
          cp uninstall_agent.sh build_output/
          cp install_menubar_agent.sh build_output/
          cp uninstall_menubar_agent.sh build_output/
          cp README.md build_output/
          cp LICENSE build_output/

          cd build_output
          zip -r "../${DIST_ZIP}" .
          cd ..

          echo "DIST_ZIP=${DIST_ZIP}" >> $GITHUB_ENV
          ls -la "${DIST_ZIP}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memory-Warning-${{ env.APP_VERSION }}-macos
          path: ${{ env.DIST_ZIP }}

      - name: Publish GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Memory Warning ${{ env.APP_VERSION }}
          files: ${{ env.DIST_ZIP }}
          draft: false
          prerelease: false
          generate_release_notes: true

